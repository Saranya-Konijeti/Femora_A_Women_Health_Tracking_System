<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Find Nearby Gynecologists & Hospitals</title>
<style>
  :root {
    --plum: #4a2545;
    --plum-deep: #2f1630;
    --rose: #d1477a;
    --rose-soft: #f6e4ec;
    --cream: #fdf9f6;
    --ink: #33242f;
    --muted: #8a7583;
    --line: #ecdfe4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--cream);
    color: var(--ink);
  }

  header {
    background: linear-gradient(120deg, var(--plum-deep), var(--plum));
    color: #fff;
    padding: 26px 24px 20px;
  }

  header h1 { margin: 0 0 4px; font-size: 1.5rem; font-weight: 700; }
  header p { margin: 0; color: #e8d7e4; font-size: 0.92rem; }

  .controls {
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 16px 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  #location-input {
    flex: 1;
    min-width: 220px;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-size: 0.95rem;
    outline: none;
  }
  #location-input:focus { border-color: var(--rose); }

  button {
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:active { transform: scale(0.98); }

  .btn-primary { background: var(--rose); color: #fff; }
  .btn-primary:hover { opacity: 0.92; }

  .btn-secondary { background: var(--rose-soft); color: var(--plum-deep); }
  .btn-secondary:hover { opacity: 0.85; }

  .chip {
    padding: 10px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .chip.active { background: var(--plum-deep); border-color: var(--plum-deep); color: #fff; }

  #status {
    padding: 8px 24px;
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 18px;
  }

  #map-wrap {
    width: 100%;
    height: calc(100vh - 220px);
    min-height: 480px;
  }

  #map-frame {
    width: 100%;
    height: 100%;
    border: 0;
  }

  .open-in-maps {
    display: inline-block;
    margin: 0 24px 16px;
    font-size: 0.85rem;
    color: var(--rose);
    text-decoration: none;
    font-weight: 600;
  }
  .open-in-maps:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>Find Nearby Gynecologists & Hospitals</h1>
  <p>Search by location or use your current position — powered by Google Maps.</p>
</header>

<div class="controls">
  <input id="location-input" type="text" placeholder="Enter a city, area, or address" />
  <button class="btn-primary" id="search-btn">Search this location</button>
  <button class="btn-secondary" id="locate-btn">📍 Use my location</button>
  <div class="chip active" data-type="both">All</div>
  <div class="chip" data-type="doctor">Gynecologists</div>
  <div class="chip" data-type="hospital">Hospitals</div>
</div>

<div id="status">Type a location above, or use your current location, to see nearby results.</div>

<div id="map-wrap">
  <iframe id="map-frame" loading="lazy" allowfullscreen></iframe>
</div>

<a class="open-in-maps" id="open-in-maps" href="#" target="_blank" rel="noopener">
  Open this search in Google Maps →
</a>

<script>
  const input = document.getElementById("location-input");
  const statusEl = document.getElementById("status");
  const mapFrame = document.getElementById("map-frame");
  const openInMapsLink = document.getElementById("open-in-maps");

  let activeFilter = "both";
  let currentPlace = null; // string address, OR "lat,lng"

  const keywordFor = (filter) =>
    filter === "doctor"
      ? "gynecologist"
      : filter === "hospital"
      ? "women's hospital maternity hospital"
      : "gynecologist women's hospital";

  function buildEmbedUrl(query, place) {
    // Uses Google's public map embed (no API key required).
    // "near" accepts either a place name or "lat,lng" coordinates.
    const q = encodeURIComponent(`${query} near ${place}`);
    return `https://www.google.com/maps?q=${q}&output=embed`;
  }

  function buildOpenUrl(query, place) {
    const q = encodeURIComponent(`${query} near ${place}`);
    return `https://www.google.com/maps/search/${q}`;
  }

  function updateMap() {
    if (!currentPlace) return;
    const keyword = keywordFor(activeFilter);
    mapFrame.src = buildEmbedUrl(keyword, currentPlace);
    openInMapsLink.href = buildOpenUrl(keyword, currentPlace);
    statusEl.textContent = `Showing "${keyword}" results near ${currentPlace}.`;
  }

  document.getElementById("search-btn").addEventListener("click", () => {
    const query = input.value.trim();
    if (!query) {
      statusEl.textContent = "Please enter a location first.";
      return;
    }
    currentPlace = query;
    updateMap();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("search-btn").click();
  });

  document.getElementById("locate-btn").addEventListener("click", () => {
    if (!navigator.geolocation) {
      statusEl.textContent = "Geolocation isn't supported by your browser.";
      return;
    }
    statusEl.textContent = "Getting your current location...";
    navigator.geolocation.getCurrentPosition(
      (position) => {
        currentPlace = `${position.coords.latitude},${position.coords.longitude}`;
        updateMap();
      },
      () => {
        statusEl.textContent =
          "Couldn't access your location. Please allow location access or enter it manually.";
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  });

  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      document.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      activeFilter = chip.dataset.type;
      if (currentPlace) updateMap();
    });
  });
</script>

</body>
</html>
